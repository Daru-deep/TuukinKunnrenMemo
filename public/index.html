<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="通勤訓練の記録アプリ" />
    <title>通勤記録</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>通勤記録</h1>
      <p class="app-header__count" id="record-count">読み込み中…</p>
    </header>

    <nav class="tabs" role="tablist" aria-label="画面切り替え">
      <button class="tab" role="tab" data-tab="outbound" aria-selected="true">行き</button>
      <button class="tab" role="tab" data-tab="inbound" aria-selected="false">帰り</button>
      <button class="tab" role="tab" data-tab="summary" aria-selected="false">集計・出力</button>
    </nav>

    <main>
      <!-- 行き／帰りの入力欄は同じ構造なので、下の <template> から複製して作る -->
      <section class="panel" id="panel-outbound" data-direction="outbound" role="tabpanel"></section>
      <section class="panel" id="panel-inbound" data-direction="inbound" role="tabpanel" hidden></section>

      <section class="panel" id="panel-summary" role="tabpanel" hidden>
        <div class="stats" id="stats"></div>

        <section class="card">
          <h2>最短記録のルート</h2>
          <p class="card__note" id="fastest-note">記録がありません</p>
          <div class="map" id="fastest-map"></div>
        </section>

        <section class="card">
          <h2>記録一覧</h2>
          <div class="list" id="record-list"></div>
        </section>

        <section class="card">
          <h2>出力</h2>
          <p class="card__note">
            入力項目に加えて、所要時間と判定を含んだxlsxを書き出します。<br />
            GPSの座標そのものは含みません（位置が分かるファイルを配らないため）。
          </p>
          <a class="button button--primary" id="download-xlsx" href="/api/export.xlsx">
            xlsxをダウンロード
          </a>
        </section>
      </section>
    </main>

    <!-- 記録の詳細（一覧をタップしたときに開く） -->
    <dialog class="detail" id="detail-dialog">
      <div class="detail__body" id="detail-body"></div>
      <div class="detail__actions">
        <button type="button" class="button" id="detail-edit">編集する</button>
        <button type="button" class="button button--danger" id="detail-delete">削除</button>
        <button type="button" class="button" id="detail-close">閉じる</button>
      </div>
    </dialog>

    <p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

    <!-- ここから下は行き／帰りフォームの雛形。JS（js/form.js）が複製して使う -->
    <template id="form-template">
      <form class="record-form" novalidate>
        <p class="editing-banner" data-editing-banner hidden>
          既存の記録を編集しています
          <button type="button" class="link" data-action="cancel-edit">やめる</button>
        </p>

        <div class="field">
          <label class="field__label" for="">日付</label>
          <input class="input" type="date" name="date" required />
        </div>

        <div class="field">
          <label class="field__label">出発時刻</label>
          <div class="time-row">
            <input class="input" type="time" name="departureTime" required />
            <button type="button" class="button button--now" data-now="departureTime">今</button>
          </div>
        </div>

        <div class="field">
          <label class="field__label">乗車電車（発車時刻）</label>
          <div class="time-row">
            <input class="input" type="time" name="trainTime" />
            <button type="button" class="button button--now" data-now="trainTime">今</button>
          </div>
        </div>

        <div class="field" data-choice-group="crowding">
          <span class="field__label">混雑度</span>
          <div class="choices" role="radiogroup" aria-label="混雑度"></div>
        </div>

        <div class="field" data-choice-group="delayed">
          <span class="field__label">遅延</span>
          <div class="choices" role="radiogroup" aria-label="遅延"></div>
        </div>

        <div class="field">
          <label class="field__label" data-arrival-label>到着時刻</label>
          <div class="time-row">
            <input class="input" type="time" name="arrivalTime" required />
            <button type="button" class="button button--now" data-now="arrivalTime">今</button>
          </div>
        </div>

        <div class="result" data-result>
          <span class="result__duration" data-duration>—</span>
          <span class="badge" data-judgement hidden></span>
        </div>

        <div class="field" data-choice-group="detour">
          <span class="field__label">寄り道</span>
          <div class="choices" role="radiogroup" aria-label="寄り道"></div>
        </div>

        <div class="field" data-detour-note hidden>
          <label class="field__label">寄り道メモ</label>
          <textarea class="input" name="detourNote" rows="2" placeholder="例: コンビニに寄った"></textarea>
        </div>

        <div class="field">
          <label class="field__label">メモ</label>
          <textarea class="input" name="note" rows="2" placeholder="体調・混み具合の所感など"></textarea>
        </div>

        <section class="gps">
          <div class="gps__head">
            <span class="field__label">ルート記録（GPS）</span>
            <span class="gps__state" data-gps-state>停止中</span>
          </div>
          <p class="gps__info" data-gps-info>出発前に「記録開始」を押すと軌跡を記録します。</p>
          <div class="gps__buttons">
            <button type="button" class="button button--primary" data-gps="start">記録開始</button>
            <button type="button" class="button" data-gps="stop" disabled>停止</button>
            <button type="button" class="button button--danger" data-gps="clear">軌跡を破棄</button>
          </div>
          <div class="map map--mini" data-map hidden></div>
        </section>

        <div class="actions">
          <button type="submit" class="button button--primary button--wide">保存する</button>
          <button type="button" class="button" data-action="reset">入力をクリア</button>
        </div>

        <p class="errors" data-errors hidden></p>
      </form>
    </template>

    <script src="/vendor/leaflet/leaflet.js"></script>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
